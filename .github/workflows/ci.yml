name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, "1.74"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Doc tests
        run: cargo test --workspace --doc

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: no default features (no_std)
        run: cargo build -p ethiopic-calendar --no-default-features
      - name: alloc only
        run: cargo build -p ethiopic-calendar --no-default-features --features alloc
      - name: all features
        run: cargo test -p ethiopic-calendar --all-features

  no_std:
    name: no_std target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build for a bare-metal target
        run: cargo build -p ethiopic-calendar --no-default-features --features alloc --target thumbv7em-none-eabihf

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build docs with intra-doc link checking
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz round-trip identities
        run: cargo fuzz run roundtrip -- -runs=200000 -max_total_time=90
        working-directory: .
      - name: Fuzz the parser
        run: cargo fuzz run parse -- -runs=200000 -max_total_time=60
      - name: Fuzz the formatter
        run: cargo fuzz run format -- -runs=200000 -max_total_time=60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  bench:
    name: benchmarks compile and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Smoke-run the benchmarks
        run: cargo bench -p ethiopic-calendar -- --test

  vectors:
    name: test vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate vectors from the Python reference
        run: python3 reference/gen_vectors.py
      - name: They must match what is committed
        run: git diff --exit-code -- crates/ethiopic-calendar/tests/data

  cabi:
    name: C ABI header and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the shared library and regenerate the header
        run: ETHIOPIC_UPDATE_HEADER=1 cargo build -p ethiopic-ffi --release
      - name: The committed header must match the source
        run: git diff --exit-code -- crates/ethiopic-ffi/include/ethiopic.h
      - name: Compile and run the C example against libethiopic.so
        run: |
          cc -Wall -Wextra -Werror -I crates/ethiopic-ffi/include \
             crates/ethiopic-ffi/examples/demo.c \
             -L target/release -lethiopic -o /tmp/demo
          LD_LIBRARY_PATH=target/release /tmp/demo
      - name: Check the exported symbol table
        run: |
          nm -D --defined-only target/release/libethiopic.so | grep -c ' T eth_'
          ! nm -D --defined-only target/release/libethiopic.so | grep -q ' T rust_'

  cli:
    name: CLI, man page and completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shells and roff tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish groff man-db
      - name: End-to-end CLI tests
        run: cargo test -p ethdate --all-targets
      - name: Smoke-test the installed binary
        run: |
          set -euo pipefail
          cargo build -p ethdate --release
          BIN=target/release/ethdate
          $BIN --version
          test "$($BIN -F gregorian --iso 2024-09-11)" = "2017-01-01"
          test "$($BIN -g --iso 2015-13-06)" = "2023-09-11"
          $BIN --holidays 2017 --locale en
          $BIN --computus 2017
          $BIN --year 2017 --locale en | head -20
          $BIN --waybar 2017-01-01
          seq 0 6 | sed 's/^/+/' | $BIN - --iso
          $BIN --holidays | head -1        # a broken pipe must not be an error
      - name: The man page must be free of roff warnings
        run: |
          set -euo pipefail
          groff -man -Tutf8 -ww -z crates/ethdate/man/ethdate.1 2>err.txt || true
          if [ -s err.txt ]; then echo "roff warnings:"; cat err.txt; exit 1; fi
          man --warnings -E UTF-8 -l crates/ethdate/man/ethdate.1 > /dev/null
      - name: Completions must be syntactically valid
        run: |
          set -euo pipefail
          bash -n crates/ethdate/completions/ethdate.bash
          zsh -n crates/ethdate/completions/_ethdate
          fish -n crates/ethdate/completions/ethdate.fish
      - name: Every option in --help must be documented in the man page
        run: |
          set -euo pipefail
          missing=0
          for opt in $(target/release/ethdate --help | grep -oE '^\s+--[a-z-]+|, --[a-z-]+' | grep -oE '\--[a-z-]+' | sort -u); do
            stripped="${opt#--}"
            if ! grep -q -- "\\-\\-$stripped" crates/ethdate/man/ethdate.1; then
              echo "man page does not document $opt"; missing=1
            fi
          done
          exit $missing
