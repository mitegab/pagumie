[package]
name = "ethdate"
description = "The Ethiopian calendar on the command line: conversion, formatting, holidays, Bahire Hasab and a cal(1)-style grid, with no runtime dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "date-and-time", "localization"]
readme = "README.md"

[[bin]]
name = "ethdate"
path = "src/main.rs"

[dependencies]
ethiopic-calendar = { workspace = true, features = ["std"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The render layer appends prose to a String builder. `write!` would avoid the
# temporary `format!` allocation, but at ~28 sites it needs a `fmt::Write`
# import and a `let _ =` on every one of them, in a CLI that renders a few
# hundred bytes. The allocation is not what this binary spends its time on.
format_push_string = "allow"
# The JSON/Waybar renderers use short, math-style locals whose names mirror the
# keys of the output format they emit; renaming them would obscure that mapping.
many_single_char_names = "allow"
# `Options` is the flag bag behind --help: one bool per switch is the design.
struct_excessive_bools = "allow"
