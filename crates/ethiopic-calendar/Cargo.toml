[package]
name = "ethiopic-calendar"
description = "Correctness-obsessed proleptic Ethiopian (Ge'ez) calendar arithmetic: Ethiopic <-> Gregorian <-> Julian <-> Julian Day Number conversion, Baḥire Ḥasab computus, Ethiopian clock time. Zero dependencies, no_std."
readme = "README.md"
documentation = "https://docs.rs/ethiopic-calendar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "conversions"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
