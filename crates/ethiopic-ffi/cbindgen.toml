language = "C"
header = """/* libethiopic — C ABI for the Ethiopian calendar.
 *
 * Generated by cbindgen from crates/ethiopic-ffi; do not edit by hand.
 * Regenerate with:  ETHIOPIC_UPDATE_HEADER=1 cargo build -p ethiopic-ffi
 *
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */"""
include_guard = "ETHIOPIC_H"
pragma_once = false
autogen_warning = ""
include_version = true
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
line_length = 90
style = "type"

[export]
prefix = ""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
